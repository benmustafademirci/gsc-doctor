name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo report smoke test
        run: |
          node dist/cli.js --demo --out demo-report.html --json demo-report.json --no-color
          test -s demo-report.html
      - name: Upload demo report
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo-report.html
